<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="You have just finished. A house of two thousand people is about to decide what they think.">
<title>Ovation</title>
<style>
  :root { color-scheme: dark; --ground: #000; --ink: #f3e6cf; --dim: rgba(243, 230, 207, .58); --serif: Didot, "Bodoni 72", "Bodoni MT", "Libre Bodoni", "Playfair Display", Baskerville, "Hoefler Text", "Palatino Linotype", Palatino, Georgia, serif; --text: Baskerville, "Hoefler Text", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); overflow: hidden; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; cursor: default; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; outline: none; }
  .card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; text-align: center; padding: 0 16px; transition: opacity .9s ease; }
  #title h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 7.2vw, 88px); letter-spacing: .42em; margin: 0 0 0 .42em; line-height: 1; }
  #title p { font-family: var(--text); font-style: italic; font-size: clamp(15px, 1.9vw, 21px); color: var(--dim); margin: 1.6em 0 0; letter-spacing: .02em; }
  #title .rule { width: 42px; height: 1px; background: rgba(243, 230, 207, .35); margin-top: 1.8em; }
  #hint { position: fixed; left: 0; right: 0; bottom: max(26px, calc(env(safe-area-inset-bottom) + 14px)); text-align: center; font-family: var(--text); font-style: italic; font-size: 15px; letter-spacing: .06em; color: rgba(243, 230, 207, .8); text-shadow: 0 1px 8px rgba(0,0,0,.9); pointer-events: none; transition: opacity 1.2s ease; }
  #hint svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 7px; opacity: .8; }
  #end h2 { font-family: var(--text); font-style: italic; font-weight: 400; font-size: clamp(17px, 2.3vw, 26px); color: var(--dim); margin: 0; letter-spacing: .01em; }
  #end h3 { font-family: var(--text); font-style: italic; font-weight: 400; font-size: clamp(15px, 1.7vw, 19px); color: rgba(243, 230, 207, .78); margin: .9em 0 0; }
  #end p { font-family: var(--serif); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: rgba(243, 230, 207, .34); margin: 1.4em 0 0; font-variant-numeric: lining-nums tabular-nums; }
  #end p span { white-space: nowrap; } #end p i { font-style: normal; }
  @media (max-width: 520px) { #end p { display: flex; flex-direction: column; gap: .7em; } #end p i { display: none; } }
  #end button { pointer-events: auto; margin-top: 2.2em; background: none; border: 1px solid rgba(243, 230, 207, .28); color: var(--ink); font-family: var(--serif); font-size: 13px; letter-spacing: .32em; padding: 1.05em 1.5em 1em 1.82em; border-radius: 999px; cursor: pointer; transition: border-color .3s, background .3s; }
  #end button:hover, #end button:focus-visible { border-color: rgba(243, 230, 207, .7); background: rgba(243, 230, 207, .06); outline: none; }
  #fail { font-family: var(--text); font-style: italic; color: var(--dim); }
  #dbg { position: fixed; left: 8px; top: 6px; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #9f9; white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #000; }
  @media (prefers-reduced-motion: reduce) { .card, #hint { transition: none; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="The view from the stage of an opera house. Tap or press space to bow. Drag or use the arrow keys to walk."></canvas>
<div class="card" id="title"><h1>OVATION</h1><p>You have just finished.</p><div class="rule"></div></div>
<div id="hint"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2.5 6h2.5l3.5-3v10l-3.5-3h-2.5z"/><path d="M11 5.5c1 .8 1 4.2 0 5M12.8 3.8c2 1.8 2 6.6 0 8.4"/></svg><span>tap to begin · sound on</span></div>
<div class="card" id="end" style="opacity:0"><h2>Everyone has gone home.</h2><h3 id="said"></h3><p id="tally"></p><button id="again" type="button">ANOTHER NIGHT</button></div>
<script>
(() => {
'use strict';
const WORKLET_SRC = "// worklet.js — runs on the audio thread. Every sound is a pre-synthesised grain written *ahead* into ring buffers at\n// its exact sample: crowd sounds into one mono ring per zone of the house (each zone then gets air absorption and a\n// pan relative to where the performer stands), everything else into stereo rings. Two outputs: dry, and a send for\n// the hall's convolution reverb. The same class also runs on the main thread inside a ScriptProcessor where\n// AudioWorklet is unavailable, so it keeps its own sample clock (this.frame) instead of reading worklet globals.\nconst RING = 1 << 18; // ~5.4 s at 48 kHz\nconst MASK = RING - 1;\n\nclass House extends AudioWorkletProcessor {\n  constructor(opts) {\n    super();\n    const o = opts.processorOptions;\n    this.banks = o.banks;                  // { name: [Float32Array, ...] }\n    this.nz = o.zones;\n    this.zbuf = []; this.z = [];\n    for (let k = 0; k < this.nz; k++) {\n      this.zbuf.push(new Float32Array(RING));\n      this.z.push({ gl: 0, gr: 0, tgl: 0, tgr: 0, a: 0.5, s1: 0, s2: 0, send: 0.4, tsend: 0.4 });\n    }\n    this.fx = [new Float32Array(RING), new Float32Array(RING)];\n    this.fxs = [new Float32Array(RING), new Float32Array(RING)];\n    this.room = 0; this.troom = 0; this.mur = 0; this.tmur = 0; this.muf = 0; this.cheer = 0; this.tcheer = 0;\n    this.n1 = 0; this.n2 = 0; this.b = 0;\n    this.talk = Array.from({ length: 10 }, (_, i) => ({ ph: Math.random() * 6.28, f: 2.5 + Math.random() * 3, lp1: 0, lp2: 0, bp: 0, fc: 0.04 + 0.05 * Math.random(), pan: Math.random() * 2 - 1, amp: 0 }));\n    this.seed = 1234567; this.frame = 0; this.lastN = 128;\n    if (this.port) this.port.onmessage = (e) => this.msg(e.data);\n  }\n  rnd() { this.seed = (this.seed * 1664525 + 1013904223) >>> 0; return this.seed / 4294967296 * 2 - 1; }\n  msg(d) {\n    if (d.type === 'ev') {\n      const a = d.data, names = d.names;\n      for (let i = 0; i < a.length; i += 6) {\n        const frame = Math.round(a[i]), bank = this.banks[names[a[i + 1] | 0]], g = a[i + 4];\n        if (!bank) continue;\n        const buf = bank[(a[i + 2] | 0) % bank.length], zone = a[i + 3] | 0;\n        const now = this.frame + this.lastN;\n        let start = frame - now, k0 = 0;\n        if (start < 0) { if (start < -0.04 * sampleRate) continue; start = 0; }   // a little late: play it whole, now\n        if (start + buf.length > RING - 256) continue;\n        const w0 = now + start;\n        if (zone >= 0) {\n          const zb = this.zbuf[zone];\n          for (let k = k0; k < buf.length; k++) zb[(w0 + k - k0) & MASK] += buf[k] * g;\n        } else {\n          const pan = a[i + 5], gl = g * Math.sqrt((1 - pan) / 2), gr = g * Math.sqrt((1 + pan) / 2), s = a[i + 3] === -2 ? 0.25 : 0.55;\n          const L = this.fx[0], R = this.fx[1], SL = this.fxs[0], SR = this.fxs[1];\n          for (let k = k0; k < buf.length; k++) { const j = (w0 + k - k0) & MASK, v = buf[k]; L[j] += v * gl; R[j] += v * gr; SL[j] += v * gl * s; SR[j] += v * gr * s; }\n        }\n      }\n    } else if (d.type === 'zones') {\n      const a = d.data;\n      for (let k = 0; k < this.nz; k++) { const z = this.z[k]; z.tgl = a[k * 4]; z.tgr = a[k * 4 + 1]; z.a = a[k * 4 + 2]; z.tsend = a[k * 4 + 3]; }\n    } else if (d.type === 'amb') { this.troom = d.room; this.tmur = d.murmur; if (d.cheer != null) this.tcheer = d.cheer; }\n  }\n  process(_, outs) {\n    const dry = outs[0], send = outs[1];\n    if (typeof currentFrame !== 'undefined') this.frame = currentFrame;\n    const L = dry[0], R = dry[1], SL = send[0], SR = send[1], n = L.length, f0 = this.frame; this.lastN = n;\n    for (let k = 0; k < this.nz; k++) {\n      const z = this.z[k], zb = this.zbuf[k], a = z.a;\n      let s1 = z.s1, s2 = z.s2, gl = z.gl, gr = z.gr, sd = z.send; const dgl = (z.tgl - gl) / n, dgr = (z.tgr - gr) / n, dsd = (z.tsend - sd) / n;\n      for (let i = 0; i < n; i++) {\n        const j = (f0 + i) & MASK, v = zb[j]; zb[j] = 0;\n        s1 = v + (s1 - v) * a; s2 = s1 + (s2 - s1) * a;\n        gl += dgl; gr += dgr; sd += dsd;\n        L[i] += s2 * gl; R[i] += s2 * gr; const w = s2 * sd; SL[i] += w; SR[i] += w;\n      }\n      z.s1 = s1; z.s2 = s2; z.gl = gl; z.gr = gr; z.send = sd;\n    }\n    const FL = this.fx[0], FR = this.fx[1], XL = this.fxs[0], XR = this.fxs[1];\n    for (let i = 0; i < n; i++) { const j = (f0 + i) & MASK; L[i] += FL[j]; R[i] += FR[j]; SL[i] += XL[j]; SR[i] += XR[j]; FL[j] = 0; FR[j] = 0; XL[j] = 0; XR[j] = 0; }\n    // room tone (air handling, a big quiet space) and the murmur of a waiting or departing audience\n    this.room += (this.troom - this.room) * 0.002; this.mur += (this.tmur - this.mur) * 0.001;\n    if (this.room > 1e-5 || this.mur > 1e-5) {\n      for (let i = 0; i < n; i++) {\n        const w = this.rnd();\n        this.b = this.b * 0.997 + w * 0.03; this.n1 = this.n1 * 0.9 + w * 0.1;\n        const rt = (this.b * 1.4 + this.n1 * 0.08) * this.room;\n        L[i] += rt; R[i] += rt * 0.96; SL[i] += rt * 0.3; SR[i] += rt * 0.3;\n      }\n      if (this.mur > 1e-5) {\n        for (const tk of this.talk) {\n          const df = tk.f / sampleRate * 6.2832;\n          for (let i = 0; i < n; i++) {\n            tk.ph += df * (1 + 0.3 * Math.sin(tk.ph * 0.37));\n            const syl = Math.max(0, Math.sin(tk.ph)) ** 2 * (0.6 + 0.4 * Math.sin(tk.ph * 0.13));\n            const w = this.rnd();\n            tk.lp1 += (w - tk.lp1) * tk.fc * 3; tk.lp2 += (tk.lp1 - tk.lp2) * tk.fc * 1.5;\n            const v = (tk.lp1 - tk.lp2) * syl * this.mur * 0.9;\n            L[i] += v * (1 - tk.pan) * 0.3; R[i] += v * (1 + tk.pan) * 0.3; SL[i] += v * 0.8; SR[i] += v * 0.8;\n          }\n        }\n      }\n    }\n    return true;\n  }\n}\nregisterProcessor('house', House);\n";
// ───────── util.js ─────────
// util.js — small maths, randomness and matrices. Everything shares one scope (see tools/build.mjs).

const TAU = Math.PI * 2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const approach = (x, target, rate, dt) => x + (target - x) * (1 - Math.exp(-rate * dt));

function makeRng(seed) {
  let s = seed | 0;
  const r = () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  r.gauss = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * r()); };
  r.range = (a, b) => a + (b - a) * r();
  r.pick = arr => arr[(r() * arr.length) | 0];
  return r;
}

// Column-major 4×4 matrices as Float32Array(16).
const M4 = {
  perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far), m = new Float32Array(16);
    m[0] = f / aspect; m[5] = f; m[10] = (far + near) * nf; m[11] = -1; m[14] = 2 * far * near * nf; return m;
  },
  lookAt(eye, at, up) {
    let zx = eye[0] - at[0], zy = eye[1] - at[1], zz = eye[2] - at[2]; let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx; l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    const m = new Float32Array(16);
    m[0] = xx; m[1] = yx; m[2] = zx; m[4] = xy; m[5] = yy; m[6] = zy; m[8] = xz; m[9] = yz; m[10] = zz;
    m[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]); m[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]); m[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]); m[15] = 1;
    return m;
  },
  mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    }
    return o;
  },
  // project a world point with a view-projection matrix → [ndcX, ndcY, w]
  project(m, x, y, z) {
    const X = m[0] * x + m[4] * y + m[8] * z + m[12], Y = m[1] * x + m[5] * y + m[9] * z + m[13], W = m[3] * x + m[7] * y + m[11] * z + m[15];
    return [X / W, Y / W, W];
  },
};

// ───────── house.js ─────────
// house.js — the venue: an Italianate horseshoe opera house seen from its stage.
// Units are metres. x → performer's right, y ↑, z → away from the stage into the house.
// The stalls floor at the front row is y = 0; the stage floor is y = STAGE_Y; the stage edge is z = 0.

const STAGE_Y = 1.15;
const EYE = 1.66;                 // performer's eye height above the stage
const PERF_Z = -3.4;              // where the performer stands (upstage of the edge)
const PIT_Z = 2.9;                // orchestra pit between the stage edge and the front row
const WING_X = 7.4;               // |x| beyond which the performer is in the wings
const HOUSE = {
  tiers: [4.5, 7.5, 10.5, 13.5],  // parapet top heights (above the stalls floor)
  sideX: 12.4, sideZ0: 3.4, backCz: 12.5, backA: 12.4, backB: 15.2,
  ceilingY: 17.2, chandelier: [0, 14.2, 14.8], booth: [0, 15.6, 29.2],
};

// The horseshoe plan curve, sampled as a polyline from the left proscenium end, round the back, to the right.
function horseshoeCurve(offset) {
  const pts = [];
  const { sideX, sideZ0, backCz, backA, backB } = HOUSE;
  const a = backA + offset, b = backB + offset, sx = sideX + offset;
  for (let z = sideZ0; z < backCz; z += 0.25) pts.push([-sx, z]);
  for (let i = 0; i <= 160; i++) { const th = -Math.PI / 2 + Math.PI * i / 160; pts.push([Math.sin(th) * a, backCz + Math.cos(th) * b]); }
  for (let z = backCz - 0.25; z >= sideZ0; z -= 0.25) pts.push([sx, z]);
  // cumulative arc length and inward normals (pointing into the house)
  const len = [0];
  for (let i = 1; i < pts.length; i++) len.push(len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const at = (s) => { // s in metres along the curve
    s = clamp(s, 0, len[len.length - 1]);
    let lo = 0, hi = len.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (len[m] < s) lo = m; else hi = m; }
    const t = (s - len[lo]) / Math.max(1e-6, len[hi] - len[lo]);
    const x = lerp(pts[lo][0], pts[hi][0], t), z = lerp(pts[lo][1], pts[hi][1], t);
    let tx = pts[hi][0] - pts[lo][0], tz = pts[hi][1] - pts[lo][1]; const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
    return { x, z, nx: tz, nz: -tx, tx, tz }; // (nx,nz) points inward, into the house, for this winding
  };
  return { pts, length: len[len.length - 1], at };
}

function buildHouse(seed) {
  const rng = makeRng(seed);
  const seats = [];   // every seat, occupied or not: {x,y,z, face:[fx,fz], tier, row, box, occupied, person}
  // ── stalls: shallow-raked rows on arcs centred behind the stage, split by two aisles
  for (let r = 0; r < 21; r++) {
    const z0 = 3.9 + r * 0.96, y = r * 0.105, R = z0 + 56;
    const halfW = Math.min(11.3, 6.6 + r * 0.3);
    const n = Math.floor(halfW * 2 / 0.56);
    for (let k = 0; k < n; k++) {
      const x0 = -halfW + (k + .5) * (halfW * 2 / n);
      if (Math.abs(Math.abs(x0) - 4.0) < 0.5) continue;              // aisles
      const a = Math.asin(clamp(x0 / R, -1, 1)), x = Math.sin(a) * R, z = -56 + Math.cos(a) * R;
      seats.push({ x, y, z, fx: -Math.sin(a), fz: -Math.cos(a), tier: 0, row: r, box: 0 });
    }
  }
  // ── horseshoe tiers: parapet, then rows stepping up and back; the sides are divided into boxes
  HOUSE.tiers.forEach((top, ti) => {
    const rows = ti === 3 ? 4 : 3, rise = ti === 3 ? 0.55 : 0.38;
    for (let r = 0; r < rows; r++) {
      const c = horseshoeCurve(0.55 + r * 0.86);
      const pitch = 0.6, n = Math.floor(c.length / pitch);
      for (let k = 0; k < n; k++) {
        const s = (k + .5) * c.length / n, p = c.at(s);
        if (p.z < HOUSE.sideZ0 + 0.8) continue;
        const boxIdx = Math.floor(s / 2.5);
        if (ti < 3 && p.z < HOUSE.backCz && (s % 2.5) < 0.35) continue; // box partitions on the sides
        seats.push({ x: p.x, y: top - 1.0 + r * rise, z: p.z, fx: p.nx, fz: p.nz, tier: ti + 1, row: r, box: ti < 3 && p.z < HOUSE.backCz ? boxIdx + 1 : 0 });
      }
    }
  });
  // ── who came tonight: ~94% occupancy, fuller in the good seats
  const people = [];
  for (const s of seats) {
    const good = s.tier === 0 ? 1 - s.row / 60 : 0.93 - s.tier * 0.02;
    s.occupied = rng() < good * 0.97;
    if (!s.occupied) continue;
    s.person = people.length;
    people.push(s);
  }
  // distance and bearing from the performer's home mark (for audio zones and sight-lines)
  for (const p of people) {
    const dx = p.x, dz = p.z - PERF_Z, dy = p.y + 1.1 - (STAGE_Y + EYE);
    p.dist = Math.hypot(dx, dy, dz);
    p.az = Math.atan2(dx, dz);
    p.el = Math.atan2(dy, Math.hypot(dx, dz));
  }
  // neighbours (for contagion) and "the people in front of me" (for the standing cascade: you see the rows ahead)
  const N = people.length, cell = 2.2, grid = new Map(), key = (i, j, k) => i + ',' + j + ',' + k;
  people.forEach((p, i) => { const kk = key(Math.floor(p.x / cell), Math.floor(p.y / cell), Math.floor(p.z / cell)); (grid.get(kk) || grid.set(kk, []).get(kk)).push(i); });
  for (let i = 0; i < N; i++) {
    const p = people[i], gi = Math.floor(p.x / cell), gj = Math.floor(p.y / cell), gk = Math.floor(p.z / cell);
    const near = [], front = [];
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let c = -1; c <= 1; c++) {
      const list = grid.get(key(gi + a, gj + b, gk + c)); if (!list) continue;
      for (const j of list) { if (j === i) continue; const q = people[j];
        const d = Math.hypot(q.x - p.x, (q.y - p.y) * 1.5, q.z - p.z);
        if (d < 2.3) near.push([d, j]);
        // in front: closer to the stage along my facing, roughly within my view cone, same level
        const ahead = (q.x - p.x) * p.fx + (q.z - p.z) * p.fz, side = Math.abs((q.x - p.x) * p.fz - (q.z - p.z) * p.fx);
        if (ahead > 0.3 && ahead < 3.2 && side < ahead * 1.1 + 0.6 && Math.abs(q.y - p.y) < 1.0 && q.tier === p.tier) front.push([ahead + side, j]);
      }
    }
    near.sort((u, v) => u[0] - v[0]); front.sort((u, v) => u[0] - v[0]);
    p.near = near.slice(0, 10).map(e => e[1]);
    p.front = front.slice(0, 7).map(e => e[1]);
  }
  return { seats, people, N, rng };
}

// ───────── crowd.js ─────────
// crowd.js — the audience as a physical system.
//
//  • Onset/offset of clapping by social contagion: you start when you're moved and hear others; you stop when
//    they stop (Mann, Faria, Sumpter & Krause 2013, "The dynamics of audience applause").
//  • Two clapping modes: fast, loose "mode I" (~4 Hz) and slow, even "mode II" (~2 Hz, half the dispersion). Only in
//    mode II is the crowd able to lock phase: a Kuramoto mean field of what everyone hears. When they want to be
//    louder they speed up again and the rhythm dissolves (Néda, Ravasz, Brechet, Vicsek & Barabási 2000).
//  • Standing: you stand when moved enough, or when the people you can see in front of you are standing
//    (Miller & Page 2004, "The standing ovation problem"). So it starts at the front and rolls backwards and up.
//
// The model runs a little ahead of the picture so audio can be scheduled sample-accurately; the picture reads
// per-person clap times from the past.

function createCrowd(house, night, t0) {

  // where on screen is a point in the house (for picking and for the gaze)
  function toScreen(x, y, z) { const q = M4.project(view.vp, x, y, z); return [(q[0] * .5 + .5) * innerWidth, (1 - (q[1] * .5 + .5)) * innerHeight, q[2]]; }

}

// ───────── main.js ─────────
// main.js — one clock, one loop. The crowd is simulated a moment ahead of what you see so its sound can be placed on
// the audio thread to the sample; the picture reads the crowd's clap times from the past.

const Q = new URLSearchParams(location.search);
const DEBUG = Q.has('debug');
const LOOKAHEAD = 0.1;
const SPEED = +(Q.get('speed') || 1);   // testing only
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas = document.getElementById('c');
const $said = document.getElementById('said'), $tally = document.getElementById('tally'), $title = document.getElementById('title'), $hint = document.getElementById('hint'), $end = document.getElementById('end'), $again = document.getElementById('again');
const house = buildHouse(1);
let nightSeed = +(Q.get('seed') || ((Date.now() / 1000) | 0) % 100000);
let night, crowd, dir, now = 0;
const cam = { eye: [0, 0, 0], yaw: 0, pitch: 0, roll: 0, zoom: 1 };
const L = { stage: 0, spot: 0, house: 0, chand: 0, time: 0, bow: 0, perfX: 0, spotX: 0, wing: 0, exposure: 1, fade: 1, inBeam: 1, lift: 0, seek: 0 };
function begin(seed, skipPreshow) {
  night = newNight(seed); crowd = createCrowd(house, night, now); dir = createDirector(night, crowd); L.night = (seed % 997) / 997;
  if (skipPreshow) { night.again = true; dir.title = 0; dir.start(true); }
  cam.zoom = 1; L.lift = 0; L.seek = 0;
}
begin(nightSeed, false);

const audio = createAudio(house);
let R = null, glFailed = false;
function makeRenderer() { try { R = createRenderer(canvas, house); } catch (e) { console.error(e); R = null; } if (!R) glFailed = true; }
makeRenderer();
if (!R) $title.innerHTML = '<p id="fail">This needs WebGL 2, which this browser doesn’t offer.<br>Try a recent Chrome, Safari, Firefox or Edge.</p>';
// phones drop GPU contexts: stop drawing, and rebuild when it comes back
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); R = null; });
canvas.addEventListener('webglcontextrestored', () => { makeRenderer(); });

// ── input ───────────────────────────────────────────────
// A press becomes a bow unless it turns out to be a drag (a walk) within a moment; a quick tap is still a whole bow.
let down = null, keysWalk = 0, dragging = false, pressTimer = 0, pressed = false;
function unlock() { audio.start(); }
function doPress() { if (!pressed) { pressed = true; dir.press(); } }

  if (down) return;                                   // one performer, one body: ignore a second finger
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  unlock();
  down = { x: e.clientX, y: e.clientY, id: e.pointerId, lastX: e.clientX };
  dragging = false; pressed = false;
  if (dir.phase === 'preshow' || dir.phase === 'end') { doPress(); return; }
  clearTimeout(pressTimer); if (!(dir.torch > 0.3 && R && R.torchScreenX != null && e.clientX > R.torchScreenX - innerWidth * 0.12)) pressTimer = setTimeout(() => { if (down && !dragging) doPress(); }, 130);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' && !down) dir.look(-(e.clientX / innerWidth - 0.5) * 2, (e.clientY / innerHeight - 0.5) * 2);   // screen-right is world −x
  if (!down || e.pointerId !== down.id) return;
  const dx = e.clientX - down.x;
  if (!dragging && Math.abs(dx) > 14) { dragging = true; clearTimeout(pressTimer); if (pressed) dir.release(); }
  if (dragging) { dir.walkBy(-(e.clientX - down.lastX) / Math.max(320, innerWidth) * 12); down.lastX = e.clientX; }
});
const up = e => {
  if (!down || e.pointerId !== down.id) return;
  unlock();                                           // on touch screens, only the lift of the finger may start audio
  clearTimeout(pressTimer);
  if (!dragging && !pressed && e.type === 'pointerup') {
    if (dir.torch > 0.3 && R && R.torchScreenX != null && e.clientX > R.torchScreenX - innerWidth * 0.12) dir.walkTo(-9.4);   // follow the torch toward the wing
    else doPress();
  }
  down = null; dir.release();
};
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('contextmenu', e => e.preventDefault());
const isLeft = k => k === 'ArrowLeft' || k === 'a' || k === 'A', isRight = k => k === 'ArrowRight' || k === 'd' || k === 'D';
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target === $again) return;
  if (e.repeat) { if (isLeft(e.key) || isRight(e.key) || e.key === ' ') e.preventDefault(); return; }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); unlock(); if (dir.phase === 'end') return; dir.press(); }
  else if (isLeft(e.key) || isRight(e.key)) { e.preventDefault(); unlock(); const s = isLeft(e.key) ? 1 : -1; keysWalk = s; if (dir.phase === 'preshow') dir.press(); else dir.walkBy(1.6 * s); }
});
addEventListener('keyup', e => {
  if (e.key === ' ' || e.key === 'Enter') dir.release();
  if (isLeft(e.key) && keysWalk < 0) keysWalk = 0;
  if (isRight(e.key) && keysWalk > 0) keysWalk = 0;
});
function letGo() { keysWalk = 0; if (down) { down = null; clearTimeout(pressTimer); } dir.release(); }
addEventListener('blur', letGo);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) letGo();
  if (!audio.ctx) return;
  if (document.hidden) audio.ctx.suspend().catch(() => {}); else audio.ctx.resume().catch(() => {});
});
$again.addEventListener('click', e => { e.stopPropagation(); if (dir.endText < 0.9) return; unlock(); restart(); });
function restart() {
  nightSeed = (nightSeed * 7919 + 17) % 100000; begin(nightSeed, true);
  $end.style.transition = 'none'; $end.style.opacity = 0; $end.style.visibility = 'hidden';
  requestAnimationFrame(() => { $end.style.transition = ''; });
  canvas.focus({ preventScroll: true });
}

// ── the loop ────────────────────────────────────────────
let t0 = performance.now() / 1000, last = 0, frames = 0, fpsT = 0, fps = 0;
const $dbg = DEBUG ? Object.assign(document.body.appendChild(document.createElement('div')), { id: 'dbg' }) : null;
const listener = { x: 0, yaw: 0 };

function loop() {
  requestAnimationFrame(loop);
  now = performance.now() / 1000 - t0;
  let dt = now - last;
  if (dt > 0.25) { t0 += dt - 1 / 60; now = last + 1 / 60; dt = 1 / 60; } // after a hidden tab: carry on, don't catch up
  last = now;
  if (SPEED !== 1) { dt *= SPEED; now = (window.__simT = (window.__simT || 0) + dt); }
  if (keysWalk) dir.walkBy(keysWalk * 2.2 * dt);
  // the night
  dir.update(dt);
  while (crowd.S.t < now + LOOKAHEAD) crowd.step(crowd.DT);
  // one-off sounds the director asks for
  for (const c of dir.cues) {
    if (c.type === 'clunk') audio.fx('clunk', 0.55, 0);
    else if (c.type === 'cough') { const i = (Math.random() * crowd.N) | 0; crowd.S.events.push({ t: now + 0.2, type: 'cough', i, g: 1 }); }
    else if (c.type === 'step') { audio.fx('step', 0.2, 0, true); if (Math.random() < 0.18) audio.fx('creak', 0.05, 0, true); }
    else if (c.type === 'flower') audio.fx('flower', 0.28, clamp(-(c.x - dir.x) * 0.3, -1, 1), true);
    else if (c.type === 'rustle') audio.fx('rustle', 0.035, Math.random() * 2 - 1);
    else if (c.type === 'restart') restart();
    else if (c.type === 'boo') { let i = -1; for (let k = 0; k < 300 && i < 0; k++) { const j = (Math.random() * crowd.N) | 0; if (house.people[j].tier === 4) i = j; } if (i >= 0) crowd.S.events.push({ t: now + 0.4, type: 'boo', i, g: 1 }); }
    else if (c.type === 'heart') audio.fx('heart', 0.1, 0, true);
    else if (c.type === 'cheerOne') { const i = crowd.S.lastIdx; if (i >= 0) crowd.S.events.push({ t: now + 0.3, type: 'whistle', i, g: 1.4 }); }
  }
  dir.cues.length = 0;
  // the house's voice: short wordless shouts from random seats, more of them the louder the room feels
  { const cheer = Math.max(dir.cheer, dir.phase === 'ovation' ? 0.18 * smooth(0.85, 1.2, crowd.S.G) : 0);
    let n = cheer * 45 * dt;
    if (Math.random() < cheer * 3 * dt) { const i = (Math.random() * 90) | 0; if (house.people[i] && house.people[i].tier === 0 && !crowd.leave[i]) crowd.shout[i] = 1; }
    while (n > 0) { if (Math.random() < n) { const i = (Math.random() * crowd.N) | 0; if (!crowd.leave[i]) { crowd.S.events.push({ t: now + 0.05 + Math.random() * 0.05, type: 'shout', i, g: 0.6 + 0.6 * Math.random() }); crowd.shout[i] = 1; } } n -= 1; } }
  // the pit: a dozen string players tapping their bows on their stands while the house is warm
  if (dir.phase === 'ovation' && crowd.S.G > 0.5 && !dir.offstage) {
    for (let k = 0; k < 2; k++) if (Math.random() < dt * 14 * Math.min(1, crowd.S.G)) audio.fx('bowtap', 0.07 + 0.05 * Math.random(), (Math.random() * 2 - 1) * 0.6 + dir.x * 0.05);
  }
  // camera: you are the performer
  const wingT = smooth(WING_X - 0.6, WING_X + 1.6, Math.abs(dir.x));
  const moving = Math.abs(dir.vx) > 0.15;
  const bob = moving && !CALM ? Math.abs(Math.sin(dir.stepPhase * Math.PI)) * 0.035 : 0;
  const bowE = dir.bow * dir.bow * (3 - 2 * dir.bow);
  cam.eye[0] = dir.x; cam.eye[1] = STAGE_Y + EYE - bowE * 0.34 + bob + (CALM ? 0 : Math.sin(now * 1.6) * 0.004); cam.eye[2] = PERF_Z + bowE * 0.32 - wingT * 0.3;
  cam.yaw = dir.lookYaw + dir.walkYaw + L.seek * 0.8 - 0.3 * Math.sin(Math.PI * clamp((1.4 - (dir.glanceT || 0)) / 1.4, 0, 1)) * (dir.glanceT > 0 ? 1 : 0) - Math.sign(dir.x) * wingT * 1.36 + (CALM ? 0 : Math.sin(now * 0.43) * 0.004);
  L.lift = approach(L.lift, dir.phase === 'leaving' ? smooth(0, 6, dir.phaseT) * 0.1 : 0, 0.6, dt);
  // in the empty house your eyes find the one who stayed
  let seek = 0;
  if ((dir.phase === 'last' || dir.phase === 'closing') && crowd.S.lastIdx >= 0) { const i = crowd.S.lastIdx, p = house.people[i], w = crowd.walkOffset(i); seek = Math.atan2(p.x + w[0] - dir.x, p.z + w[1] - PERF_Z); }
  L.seek = approach(L.seek, seek, 0.7, dt);
  cam.zoom = approach(cam.zoom, seek ? 0.66 : 1, seek ? 0.2 : 1, dt);
  cam.pitch = -0.035 + dir.lookPitch - bowE * 1.02 - wingT * 0.06 + L.lift * cam.zoom - (1 - cam.zoom) * 0.22;
  cam.roll = moving && !CALM ? Math.sin(dir.stepPhase * Math.PI) * 0.004 : 0;
  // light
  L.stage = dir.stage; L.spot = dir.spot; L.house = dir.house; L.chand = Math.max(0.05 * dir.stage, dir.chand); L.time = now; L.bow = bowE;
  L.perfX = dir.x; L.spotX = dir.spotX; L.wing = wingT; L.fade = dir.fade; L.inBeam = clamp(1 - Math.abs(dir.x - dir.spotX) / 1.2, 0, 1);
  L.exposure = 1.0 * (1 - 0.3 * dir.house);
  // sound
  listener.x = dir.x; listener.yaw = cam.yaw; listener.surge = crowd.S.surge || 0;
  audio.schedule(crowd.S.events, now, listener);
  audio.update(dt, listener, crowd.S, dir);
  // picture
  if (R && !(dir.phase === 'end' && dir.fade > 0.998)) R.frame(cam, L, crowd, dir, now);
  else if (R) { R.gl.bindFramebuffer(R.gl.FRAMEBUFFER, null); R.gl.clearColor(0, 0, 0, 1); R.gl.clear(R.gl.COLOR_BUFFER_BIT); }
  // words

  const needSound = !audio.running() && !audio.failed;
  $hint.style.opacity = (dir.phase === 'preshow' || (dir.phase === 'breath' && dir.phaseT > 1.5) ? 0.9 : (needSound && dir.phase !== 'end' ? (dir.t < 14 ? 0.8 : dir.t < 25 ? 0.45 : 0) * (1 - dir.fade) : 0)).toFixed(3);
  if (dir.phase !== 'preshow') $hint.lastChild.textContent = dir.phase === 'breath' ? (audio.running() || audio.failed ? 'they are waiting' : 'they are waiting \u00b7 sound on') : 'tap for sound';
  if (dir.phase === 'end' && !dir.tallied) {
    dir.tallied = true; const a = Math.round(dir.applauseT), parts = [`${Math.floor(a / 60)}′ ${String(a % 60).padStart(2, '0')}″ of applause`];
    if (dir.returns) parts.push(`${dir.returns} curtain call${dir.returns > 1 ? 's' : ''}`);
    if (dir.roses) parts.push(`${dir.roses} rose${dir.roses > 1 ? 's' : ''}`);
    const said = dir.spoiled ? 'You asked for one bow too many.' : dir.returns >= 2 ? `They called you back ${['', 'once', 'twice', 'three times', 'four times'][dir.returns] || dir.returns + ' times'}.` : dir.returns === 1 ? 'They called you back.' : dir.maxStand > 0.6 ? 'They stood for you.' : 'They were kind.';
    $said.textContent = said;
    $tally.innerHTML = parts.map(x => `<span>${x}</span>`).join('<i> \u00b7 </i>');
  }

  const endOn = dir.endText > 0.02;
  $end.style.opacity = dir.endText.toFixed(3); $end.style.visibility = endOn ? 'visible' : 'hidden'; $end.style.pointerEvents = dir.endText > 0.5 ? 'auto' : 'none';
  frames++; fpsT += dt; if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  if ($dbg) { const S = crowd.S; $dbg.textContent = `${dir.phase} ${dir.phaseT.toFixed(1)}s  fps ${fps.toFixed(0)}  N ${crowd.N}\nG ${S.G.toFixed(2)} D ${S.D.toFixed(2)} clap ${(S.frac * 100).toFixed(0)}% R ${S.R.toFixed(2)} mII ${S.meanM.toFixed(2)} stand ${(S.standFrac * 100).toFixed(0)}% left ${(S.leaving * 100).toFixed(0)}%\nfresh ${dir.fresh.toFixed(2)} budget ${dir.budget.toFixed(2)} x ${dir.x.toFixed(1)} bow ${dir.bow.toFixed(2)} audio ${audio.running()}${audio.engine ? ' ' + audio.engine.kind : ''}`; }
}
requestAnimationFrame(loop);

// hooks for the test harness
window.__ov = { get dir() { return dir; }, get crowd() { return crowd; }, audio, house, get fps() { return fps; },
  bow(ms) { dir.press(); setTimeout(() => dir.release(), ms || 400); }, walk(x) { dir.walkTo(x); }, restart };

})();
