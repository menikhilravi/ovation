</style></head><body><canvas id="c"></canvas><div id="dbg"></div>
<script>
'use strict';
// ---------------- WALLFLOWER (prototype) ----------------
// A cocktail party in lamp light. You are the one who just walked in alone.
// Hold = walk toward the pointer (distance sets pace). Tap = walk there.
// Conversation circles are Kendon F-formations; whether one opens or closes depends on how you approach.
(function () {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DEBUG = /[?&]debug/.test(location.search);
const dbgEl = document.getElementById('dbg'); if (!DEBUG) dbgEl.remove();
const TAU = Math.PI * 2;
let W = 0, H = 0, DPR = 1, T = 0;
const ROOM = { w: 14, d: 9.5, h: 2.6 };
const DOOR = { x0: 1.35, x1: 2.45, h: 2.15 };

let seed = 11; const srnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const sr = (a, b) => a + srnd() * (b - a);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const ease = (c, t, r, dt) => c + (t - c) * (1 - Math.exp(-r * dt));
const easeAng = (c, t, r, dt) => c + angDiff(t, c) * (1 - Math.exp(-r * dt));
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function col(c, m, a) { // lamp-warm tinted shade
  const r = Math.min(255, c[0] * m * 1.07) | 0, g = Math.min(255, c[1] * m * 0.97) | 0, b = Math.min(255, c[2] * m * 0.84) | 0;
  return a === undefined ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${a})`;
}

// ---------------- camera (pinhole, pitched 3/4 overhead) ----------------
const cam = { zoom: 1, base: 80, oyU: 0, zoomNear: 1.5, tx: ROOM.w / 2, tz: ROOM.d / 2, ppm: 80, pitch: 0.95, dist: 34, F: 1, cx: 0, cy: 0, oy: 0, C: [0, 0, 0], fy: 0, fz: 0, uy: 0, uz: 0, follow: false };
function camBasis() {
  const s = Math.sin(cam.pitch), c = Math.cos(cam.pitch);
  cam.C = [cam.tx, cam.dist * s, cam.tz + cam.dist * c];
  cam.fy = -s; cam.fz = -c; cam.uy = c; cam.uz = -s;
  cam.F = cam.ppm * cam.dist; cam.cx = W / 2; cam.cy = H / 2 + cam.oy;
}
const P = { x: 0, y: 0, k: 0 };
function proj(x, y, z) {
  const dx = x - cam.C[0], dy = y - cam.C[1], dz = z - cam.C[2];
  const zc = dy * cam.fy + dz * cam.fz, yc = dy * cam.uy + dz * cam.uz, k = cam.F / zc;
  P.x = cam.cx + dx * k; P.y = cam.cy - yc * k; P.k = k; return P;
}
function unproj(sx, sy) {
  const a = (sx - cam.cx) / cam.F, b = -(sy - cam.cy) / cam.F;
  const dx = a, dy = cam.fy + b * cam.uy, dz = cam.fz + b * cam.uz;
  if (dy > -1e-4) return null;
  const t = -cam.C[1] / dy; return { x: cam.C[0] + dx * t, z: cam.C[2] + dz * t };
}
function fitCamera() {
  cam.ppm = 1; cam.oy = 0; cam.tx = ROOM.w / 2; cam.tz = ROOM.d / 2; camBasis();
  const pts = [[0, 0, 0], [ROOM.w, 0, 0], [0, 0, ROOM.d], [ROOM.w, 0, ROOM.d], [0, ROOM.h, 0], [ROOM.w, ROOM.h, 0]];
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const p of pts) { proj(p[0], p[1], p[2]); x0 = Math.min(x0, P.x - cam.cx); x1 = Math.max(x1, P.x - cam.cx); y0 = Math.min(y0, P.y - cam.cy); y1 = Math.max(y1, P.y - cam.cy); }
  const fit = Math.min(W * 0.97 / (x1 - x0), H * 0.95 / (y1 - y0));
  const minP = Math.min(W, H) < 620 ? 58 : 62;
  if (fit >= minP) { cam.base = fit; cam.follow = false; cam.oyU = -(y0 + y1) / 2; cam.zoomNear = 1.5; }
  else { cam.base = Math.max(minP, H * 0.95 / (y1 - y0) * 0.72); cam.follow = true; cam.oyU = 0; cam.zoomNear = 1.25; }
  if (!cam.zoom) cam.zoom = 1;

}
// the camera leans in when you get close to a conversation, and pulls back when you are alone
function updateCamera(dt, snap) {
  let fx = player.x, fz = player.z, zT = 1, focus = player.g && !player.g.lone ? player.g : null;
  if (!focus) { let bd = 1.9; for (const g of groups) { if (g.members.length < 2) continue; const e = Math.hypot(g.cx - player.x, g.cz - player.z) - g.R; if (e < bd) { bd = e; focus = g; } } }
  if (focus && !player.entering) { zT = cam.zoomNear; fx = (player.x * 0.55 + focus.cx * 0.45); fz = (player.z * 0.55 + focus.cz * 0.45); }
  cam.zoom = snap ? zT : ease(cam.zoom, zT, 0.55, dt);
  cam.ppm = cam.base * cam.zoom;
  const w = cam.follow ? 1 : clamp((cam.zoom - 1) / (cam.zoomNear - 1), 0, 1);
  const halfW = W / 2 / cam.ppm, halfD = H / 2 / (cam.ppm * Math.sin(cam.pitch));
  let tx = fx, tz = fz + 0.3;
  tx = (ROOM.w + 1.6 < halfW * 2) ? ROOM.w / 2 : clamp(tx, halfW - 0.8, ROOM.w - halfW + 0.8);
  const zmin = halfD - 2.3, zmax = ROOM.d - halfD + 1.0;
  tz = zmin > zmax ? ROOM.d / 2 : clamp(tz, zmin, zmax);
  tx = ROOM.w / 2 + (tx - ROOM.w / 2) * w; tz = ROOM.d / 2 + (tz - ROOM.d / 2) * w;
  cam.tx = snap ? tx : ease(cam.tx, tx, 1.4, dt); cam.tz = snap ? tz : ease(cam.tz, tz, 1.4, dt);
  cam.oy = (cam.follow ? H * 0.04 : cam.oyU * cam.ppm * (1 - w));

}

// ---------------- lamps / props ----------------
const LAMPS = [
  { x: 0.55, z: 0.55, y: 1.62, i: 0.85, r: 2.7, kind: 'floor' },
  { x: 13.5, z: 0.55, y: 1.62, i: 0.8, r: 2.6, kind: 'floor' },
  { x: 0.55, z: 9.0, y: 1.62, i: 0.75, r: 2.6, kind: 'floor' },
  { x: 13.45, z: 9.0, y: 1.62, i: 0.75, r: 2.6, kind: 'floor' },
  { x: 7.0, z: 4.9, y: 2.35, i: 0.62, r: 4.6, kind: 'pendant' },
  { x: 4.0, z: 3.0, y: 2.35, i: 0.28, r: 2.4, kind: 'none' },
  { x: 10.3, z: 7.2, y: 2.35, i: 0.3, r: 2.6, kind: 'none' },
  { x: 1.9, z: 0.55, y: 0, i: 0.55, r: 1.3, kind: 'door' },
];
function light(x, z) {
  let l = 0.38;
  for (const L of LAMPS) { const dx = x - L.x, dz = z - L.z; l += L.i * Math.exp(-(dx * dx + dz * dz) / (L.r * L.r)); }
  return Math.min(1.12, l);
}
const TABLE = { x0: 12.95, x1: 13.7, z0: 1.3, z1: 3.4, h: 0.92 };

// sprites
function mkSprite(sz, fn) { const c = document.createElement('canvas'); c.width = c.height = sz; fn(c.getContext('2d'), sz); return c; }
const SPR_SOFT = mkSprite(128, (g, s) => { const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.45, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, s, s); });
const SPR_POOL = mkSprite(128, (g, s) => { const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); for (let i = 0; i <= 10; i++) { const t = i / 10; gr.addColorStop(t, `rgba(255,255,255,${Math.exp(-t * t * 2.56 * 2.3).toFixed(3)})`); } g.fillStyle = gr; g.fillRect(0, 0, s, s); });
const SPR_SHOE = mkSprite(32, (g, s) => { g.fillStyle = '#120b08'; g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 1, 0, TAU); g.fill(); });
const SPR_RING = mkSprite(128, (g, s) => { g.strokeStyle = 'rgba(255,236,200,1)'; g.lineWidth = 5; g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 5, 0, TAU); g.stroke(); });
function decal(c, img, x, z, ux, uz, a, b, alpha, s) {
  proj(x, 0, z); const x0 = P.x, y0 = P.y;
  proj(x + ux * a, 0, z + uz * a); const ax = P.x - x0, ay = P.y - y0;
  proj(x - uz * b, 0, z + ux * b); const bx = P.x - x0, by = P.y - y0;
  c.setTransform(ax * s, ay * s, bx * s, by * s, x0 * s, y0 * s); c.globalAlpha = alpha;
  c.drawImage(img, -1, -1, 2, 2); c.globalAlpha = 1;
}

// ---------------- people ----------------
const SHIRTS = ['#8c3b2e', '#a8742f', '#6e5a2a', '#7b2f3f', '#c9b48c', '#5d3a4a', '#9b5b34', '#4b5530', '#b8893e', '#6a2a24', '#d8b888', '#4a3b33', '#8a6b52', '#5c2e1f', '#a0433a', '#7a4a60', '#caa06a'].map(hex);
const PANTS = ['#231a15', '#2e241d', '#3a2a20', '#1c1714', '#4a3a2e', '#2a1d22'].map(hex);
const SKINS = ['#e6bc98', '#c8966d', '#a8764f', '#7a5236', '#5a3a26', '#eac3a0', '#d6a47c'].map(hex);
const HAIRS = ['#1d130e', '#2d1b12', '#4a2e1b', '#7a5532', '#a88a60', '#c9c0b0', '#120c0a', '#5e2c18'].map(hex);
const people = [], groups = [];
function pick(a) { return a[(srnd() * a.length) | 0]; }
function mkPerson(x, z, face) {
  const dress = srnd() < 0.3;
  const p = {
    x, z, vx: 0, vz: 0, face, head: face, h: sr(0.93, 1.06), spd: 0,
    shirt: pick(SHIRTS), pants: pick(PANTS), skin: pick(SKINS), hair: pick(HAIRS),
    hairR: srnd() < 0.1 ? 0.92 : sr(1.02, 1.12), headS: sr(0.94, 1.05),
    lw0: dress ? 0.22 : 0.14, ld0: dress ? 0.19 : 0.1,
    drink: srnd() < 0.65 ? (srnd() < 0.5 ? -1 : 1) : 0,
    speak: 0, gA: [0, 0], laugh: 0, laughS: -9, laughE: -9, nodS: -9, nodA: 0, nodNext: sr(1, 6),
    glRef: null, glX: 0, glZ: 0, glUntil: -1, bkRef: null, bkUntil: -1, beckon: 0, faceOff: 0,
    walkPh: sr(0, TAU), stride: 0, sx: x, sz: z, lx: x, lz: z, react: sr(1.4, 3.6), g: null, ph: sr(0, 100),
    isPlayer: false, gazeT: 0, gazeRef: null, lookNext: sr(2, 6), homeFace: face,
  };
  people.push(p); return p;
}
const ringR = n => n <= 1 ? 0.5 : 0.42 + 0.08 * n;
function mkGroup(cx, cz, n, open, deep) {
  const g = { cx, cz, tcx: cx, tcz: cz, hx: cx, hz: cz, members: [], open, open0: open, deep: deep || 0, R: ringR(n), tight: 1,
    speaker: null, speakT: sr(0.5, 3), laughT: sr(5, 22), laughAt: -1, app: new Map(), anchor: null, lone: false,
    backAt: -1, backRef: null, name: 'G' + groups.length, vol: 0 };
  const a0 = sr(0, TAU);
  for (let i = 0; i < n; i++) {
    const a = a0 + i * TAU / n + sr(-0.12, 0.12);
    const p = mkPerson(cx + Math.cos(a) * g.R, cz + Math.sin(a) * g.R, a + Math.PI); p.g = g; g.members.push(p);
  }

}
mkGroup(4.7, 2.5, 4, 0.72);
mkGroup(9.0, 2.2, 5, 0.85);
mkGroup(2.7, 5.7, 2, 0.2, 0.65);
mkGroup(6.9, 5.3, 6, 0.55);
mkGroup(11.3, 5.2, 4, 0.33, 0.35);
mkGroup(4.9, 8.2, 3, 0.62);
mkGroup(9.3, 8.1, 2, 0.45, 0.4);
mkGroup(12.4, 8.3, 3, 0.5);
function mkLone(p, face) { // someone alone: a group of one whose o-space is just in front of them
  const g = { cx: p.x + Math.cos(face) * 0.5, cz: p.z + Math.sin(face) * 0.5, tcx: 0, tcz: 0, hx: 0, hz: 0, members: [p], open: 0.95, open0: 0.95, deep: 0,
    R: 0.5, tight: 1, speaker: null, speakT: 99, laughT: 99, laughAt: -1, app: new Map(), anchor: null, lone: true, backAt: -1, backRef: null, name: 'L' + groups.length, vol: 0,
    homeX: p.x, homeZ: p.z, homeFace: face };
  g.tcx = g.hx = g.cx; g.tcz = g.hz = g.cz; p.g = g; p.face = p.head = p.homeFace = face; groups.push(g); return g;
}
const barman = mkPerson(12.35, 2.35, Math.PI * 0.93); barman.drink = 1; mkLone(barman, Math.PI * 0.93);

// the player
const player = mkPerson(1.9, 0.25, Math.PI / 2);
Object.assign(player, { isPlayer: true, shirt: hex('#5b7590'), pants: hex('#272b31'), skin: hex('#dcb08c'), hair: hex('#2a1c14'), hairR: 1.06, h: 1.0, drink: 0, lw0: 0.14, ld0: 0.1, entering: true, settleX: 0, settleZ: 0, inT: 0 });
let newcomer = null;

// ---------------- input ----------------
const ptr = { down: false, sx: 0, sy: 0, t0: 0, moved: 0, id: -1 };
let tap = null, marker = null, lastInput = 0, firstInput = false;
function onDown(e) {
  if (ptr.down) return; e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  ptr.down = true; ptr.id = e.pointerId; ptr.sx = e.clientX; ptr.sy = e.clientY; ptr.t0 = performance.now(); ptr.moved = 0;
  tap = null; lastInput = T; firstInput = true; audioStart();
}
function onMove(e) { if (!ptr.down || e.pointerId !== ptr.id) return; ptr.moved += Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy); ptr.sx = e.clientX; ptr.sy = e.clientY; lastInput = T; }
function onUp(e) {
  if (!ptr.down || e.pointerId !== ptr.id) return; ptr.down = false; lastInput = T;
  const dur = performance.now() - ptr.t0;
  if (dur < 280 && ptr.moved < 14) {
    const w = unproj(ptr.sx, ptr.sy);
    if (w) {
      // tapping on a circle means "walk up to it": you stop at its edge, on your side
      let tx = w.x, tz = w.z;
      for (const g of groups) {
        if (g === player.g || !g.members.length) continue;
        const d = Math.hypot(w.x - g.cx, w.z - g.cz);
        if (d < g.R + 0.35) { const dx = player.x - g.cx, dz = player.z - g.cz, dd = Math.hypot(dx, dz) || 1; tx = g.cx + dx / dd * (g.R + 0.6); tz = g.cz + dz / dd * (g.R + 0.6); break; }
      }
      setTap(tx, tz, 0.85);
    }
  }
}
function setTap(x, z, spd) { x = clamp(x, 0.3, ROOM.w - 0.3); z = clamp(z, 0.3, ROOM.d - 0.3); tap = { x, z, spd }; marker = { x, z, t: T }; }
cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------------- social model ----------------
function stOf(g, a) { let s = g.app.get(a); if (!s) { s = { A: 0, I: 0, state: 'none', cool: 0, ack: false, capT: 0, deep: Math.random() < g.deep, vis: 0, edge: 9, behind: false, glN: 0 }; g.app.set(a, s); } return s; }
function glance(p, ref, dur) { p.glRef = ref; p.glUntil = T + dur; }
function sees(m, a, fov) { return Math.abs(angDiff(Math.atan2(a.z - m.z, a.x - m.x), m.face)) < (fov || 1.85); }

function admit(g, a) {
  const st = stOf(g, a); st.state = 'in'; st.A = 1; st.I = 0;
  if (g.lone) g.lone = false;
  g.members.push(a); a.g = g; g.anchor = a;
  const n = g.members.length, Rn = ringR(n);
  const dx = g.cx - a.x, dz = g.cz - a.z, d = Math.hypot(dx, dz) || 1;
  const shift = clamp(Rn - d, -0.7, 0.6);
  g.tcx = g.cx + dx / d * shift; g.tcz = g.cz + dz / d * shift;
  let best = null, bs = -1e9;
  for (const m of g.members) {
    if (m === a) continue;
    const s = -Math.abs(angDiff(Math.atan2(a.z - m.z, a.x - m.x), m.face)) - Math.hypot(a.x - m.x, a.z - m.z) * 0.4;
    if (s > bs) { bs = s; best = m; }
  }
  if (best) { best.bkRef = a; best.bkUntil = T + 1.7; glance(best, a, 2.6); g.speaker = best; g.speakT = 2.8; }
  let k = 0; for (const m of g.members) if (m !== a && m !== best) { const mm = m; setTimeout(() => glance(mm, a, rnd(0.9, 1.6)), 250 + (k++) * rnd(120, 300)); }
  g.laughAt = T + 3.4;
  if (a.isPlayer) { a.inT = 0; }
}
function reject(g, a, soft) {
  const st = stOf(g, a); st.state = 'closed'; st.cool = soft ? 11 : 15; st.A = 0;
  g.tight = soft ? 0.93 : 0.86;

    if (m.glRef === a) m.glUntil = -1;
    if (i < 2) { const an = angDiff(Math.atan2(a.z - m.z, a.x - m.x), m.face); m.faceOff = -(Math.sign(an) || 1) * (i === 0 ? 0.7 : 0.38) * (soft ? 0.7 : 1); }
  });

}
function leave(g, a) {

  const st = stOf(g, a); st.state = 'none'; st.A = 0; st.I = 0; st.cool = 4; st.ack = false;
  if (g.members.length === 1 && g.members[0].homeFace !== undefined && g.homeX !== undefined) { g.lone = true; }

  g.tight = 1; for (const m of g.members) m.faceOff = 0; g.tcx = ease(g.cx, g.hx, 1, 0.5); g.tcz = ease(g.cz, g.hz, 1, 0.5);

}

function evalApplicant(g, a, dt) {
  const st = stOf(g, a);
  if (a.g === g) { // member: leaving?
    const d = Math.hypot(a.x - g.cx, a.z - g.cz);
    if (d > g.R + 1.25) leave(g, a);
    return;
  }

    const bx = a.x - g.cx, bz = a.z - g.cz, bd = Math.hypot(bx, bz) || 1e-3, minD = g.R + 0.34;

  if (st.cool > 0) { st.cool -= dt; return; }
  const dx = a.x - g.cx, dz = a.z - g.cz, d = Math.hypot(dx, dz) || 1e-3, edge = d - g.R;
  st.edge = edge;

    if (sees(m, a)) vis++;
    if (md < nd) { nd = md; near = m; }

    if (v.pause > 0) v.pause -= dt; else if (Math.random() < dt * 0.35) v.pause = rnd(0.2, 0.9);
    let env = Math.pow(Math.abs(Math.sin(v.ph)), 1.6) * (v.pause > 0 ? 0.1 : 1);
    const talk = v.k === 0 ? 1 : 0.45;
    let laugh = 0; for (const m of g.members) laugh = Math.max(laugh, m.laugh);
    env = env * (1 - laugh * 0.5) + laugh * (0.5 + 0.5 * Math.abs(Math.sin(v.ph * 2.3)));
    const sizeF = Math.min(1, g.members.length / 4);
    v.gn.gain.setTargetAtTime(vol * env * talk * g.hush * 0.2 * (0.55 + 0.45 * sizeF), now, 0.025);
    v.bp.frequency.setTargetAtTime(v.base * (1 + laugh * 0.35) * (1 + 0.06 * Math.sin(v.ph * 0.13)), now, 0.05);
    if (v.pn) { proj(g.cx, 1.2, g.cz); v.pn.pan.setTargetAtTime(clamp((P.x / W) * 2 - 1, -1, 1) * 0.75, now, 0.1); }
  }
}

// ---------------- loop ----------------
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); cv.style.width = W + 'px'; cv.style.height = H + 'px';
  fitCamera(); updateCamera(0, true); mkVignette();
}
window.addEventListener('resize', resize); resize();

// the door opens: a couple of heads turn
setTimeout(() => {
  const near = groups.filter(g => !g.lone).map(g => ({ g, d: Math.hypot(g.cx - 1.9, g.cz - 0.5) })).sort((a, b) => a.d - b.d).slice(0, 2);
  let k = 0; for (const { g } of near) for (const m of g.members) if (sees(m, player, 1.7) && k < 3) { const mm = m; setTimeout(() => glance(mm, player, rnd(0.8, 1.3)), (k++) * 500); }
  glance(barman, player, 1.2);
}, 700);

function step(dt) {
  T += dt;
  updatePlayer(dt);
  if (newcomer) updateNewcomer(newcomer, dt);
  for (const g of groups) { evalApplicant(g, player, dt); if (newcomer && newcomer.nc.g === g && newcomer.nc.state !== 'drift' && newcomer.nc.state !== 'alone') evalApplicant(g, newcomer, dt); }
  for (const g of groups) updateGroup(g, dt);
  for (const p of people) updatePerson(p, dt);
  collide();
  updateCamera(dt, false);
  audioUpdate(dt);
}
let last = performance.now(), frames = 0, fpsT = 0, fps = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  step(dt); render();
  frames++; fpsT += dt; if (fpsT > 0.5) { fps = Math.round(frames / fpsT); frames = 0; fpsT = 0; }
  if (DEBUG) {
    let best = null, bd = 1e9; for (const g of groups) { const d = Math.hypot(g.cx - player.x, g.cz - player.z) - g.R; if (d < bd && g.members.length) { bd = d; best = g; } }
    const st = best && best.app.get(player);
    dbgEl.textContent = `t ${T.toFixed(1)} fps ${fps} spd ${player.spd.toFixed(2)} in ${player.g ? player.g.name : '-'} | near ${best ? best.name : '-'} open ${best ? best.open.toFixed(2) : ''} ` +
      (st ? `st ${st.state} A ${st.A.toFixed(2)} I ${st.I.toFixed(2)} lurk ${(st.lurk || 0).toFixed(2)} vis ${st.vis.toFixed(2)} edge ${st.edge.toFixed(2)} behind ${st.behind ? 1 : 0} deep ${st.deep ? 1 : 0}` : '') +
      (newcomer ? ` | new ${newcomer.nc.state}` : '');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------- test hooks ----------------
function gapPoint(g, out) { // a polite spot: at the edge, between two members, in view of the far side
  const ms = g.members, a0 = Math.atan2(player.z - g.cz, player.x - g.cx);
  const angs = ms.map(m => Math.atan2(m.z - g.cz, m.x - g.cx)).sort((a, b) => a - b);
  let best = a0, bd = 1e9;
  for (let i = 0; i < angs.length; i++) { const a = angs[i], b = angs[(i + 1) % angs.length] + (i === angs.length - 1 ? TAU : 0), mid = (a + b) / 2; const d = Math.abs(angDiff(mid, a0)); if (d < bd) { bd = d; best = mid; } }
  if (ms.length === 1) best = Math.atan2(g.cz - ms[0].z, g.cx - ms[0].x);
  return { x: g.cx + Math.cos(best) * (g.R + out), z: g.cz + Math.sin(best) * (g.R + out) };
}
window.__proto = {
  get state() {
    return { t: +T.toFixed(2), player: { x: +player.x.toFixed(2), z: +player.z.toFixed(2), spd: +player.spd.toFixed(2), in: player.g ? player.g.name : null },
      groups: groups.map(g => { const s = g.app.get(player); return { name: g.name, n: g.members.length, open: +g.open.toFixed(2), R: +g.R.toFixed(2), c: [+g.cx.toFixed(2), +g.cz.toFixed(2)], st: s ? s.state : '-', A: s ? +s.A.toFixed(2) : 0, I: s ? +s.I.toFixed(2) : 0, vis: s ? +s.vis.toFixed(2) : 0 }; }),
      newcomer: newcomer ? { state: newcomer.nc.state, x: +newcomer.x.toFixed(2), z: +newcomer.z.toFixed(2) } : null };
  },
  simulate(a) {
    player.entering = false; lastInput = T;
    if (a.tp) { player.x = a.tp[0]; player.z = a.tp[1]; player.vx = player.vz = 0; tap = null; }
    if (a.walkTo) setTap(a.walkTo[0], a.walkTo[1], a.speed || 0.9);
    if (a.approach !== undefined) {
      const g = groups[a.approach];
      if (a.style === 'rude') setTap(g.cx, g.cz, 1.5);
      else if (a.style === 'behind') { const m = g.members.slice().sort((p, q) => Math.hypot(p.x - player.x, p.z - player.z) - Math.hypot(q.x - player.x, q.z - player.z))[0]; const ux = m.x - g.cx, uz = m.z - g.cz, d = Math.hypot(ux, uz) || 1; setTap(m.x + ux / d * 0.62, m.z + uz / d * 0.62, 0.5); }
      else { const q = gapPoint(g, a.out || 0.7); setTap(q.x, q.z, a.speed || 0.55); }
    }
    if (a.face !== undefined) { const g = groups[a.face]; player.face = Math.atan2(g.cz - player.z, g.cx - player.x); }
    if (a.spawn) spawnNewcomer();
    if (a.stepBack) { const g = player.g; if (g) { const dx = player.x - g.cx, dz = player.z - g.cz, d = Math.hypot(dx, dz) || 1; setTap(player.x + dx / d * 0.5, player.z + dz / d * 0.5, 0.5); } }
    if (a.fast) { for (let i = 0; i < a.fast * 60; i++) step(1 / 60); }
    return this.state;
  },
  screen(x, z, y) { proj(x, y || 0, z); return [Math.round(P.x), Math.round(P.y)]; },
  groups, people, player,
};
})();
</script>
