<script>
'use strict';
// =====================================================================================
// FOUNDRY (prototype) — a bronze bell you reshape with your hands while it is still ringing.
// Profile (24 nodes, crown->lip) -> per circumferential order n=2..7 a 1-D shell/ring Rayleigh-Ritz
// eigenproblem (ring bending + meridional bending + twist, mass with inextensional tangential term)
// -> 3 meridional orders each -> calibrated so the default shape gives the church-bell series
// -> AudioWorklet modal synth (split degenerate pairs = warble), frequencies glide phase-continuously.
// =====================================================================================
(() => {
const Q = location.search;
const DEBUG = /[?&]debug\b/.test(Q);
const dbgEl = document.getElementById('dbg'); if (DEBUG) dbgEl.style.display = 'block';

// ---------------------------------------------------------------- profile
const NP = 24;
const R = new Float64Array(NP), Z = new Float64Array(NP), HT = new Float64Array(NP), SS = new Float64Array(NP);
const HANG = 1.30, CAPH = 0.12;
const DEF = [[0.50,1.30],[0.522,1.16],[0.54,1.00],[0.563,0.82],[0.60,0.63],[0.665,0.44],[0.765,0.26],[0.89,0.10],[0.965,0.03],[1.0,0.0]];
function crSpline(P, per) {
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let k = 0; k < per; k++) {
      const t = k / per, t2 = t * t, t3 = t2 * t, v = [0, 0];
      for (let d = 0; d < 2; d++) v[d] = 0.5 * (2 * p1[d] + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3);
      out.push(v);
    }
  }
  out.push(P[P.length - 1].slice());
  return out;
}
function resample(D, N, oR, oZ) {
  const cum = [0];
  for (let i = 1; i < D.length; i++) cum.push(cum[i - 1] + Math.hypot(D[i][0] - D[i - 1][0], D[i][1] - D[i - 1][1]));
  const L = cum[cum.length - 1]; let s = 0;
  for (let j = 0; j < N; j++) {
    const tgt = L * j / (N - 1);
    while (s < D.length - 2 && cum[s + 1] < tgt) s++;
    const u = (tgt - cum[s]) / Math.max(1e-9, cum[s + 1] - cum[s]);
    oR[j] = D[s][0] + (D[s + 1][0] - D[s][0]) * u; oZ[j] = D[s][1] + (D[s + 1][1] - D[s][1]) * u;
  }
}
function setDefaultShape(oR = R, oZ = Z) { resample(crSpline(DEF, 16), NP, oR, oZ); }
for (let j = 0; j < NP; j++) { SS[j] = j / (NP - 1); HT[j] = 0.045 + 0.085 * Math.exp(-(((SS[j] - 0.87) / 0.10) ** 2)); }
setDefaultShape();
const DEF_R = R.slice(), DEF_Z = Z.slice();

// ---------------------------------------------------------------- modal model
const MODES = []; for (let n = 2; n <= 7; n++) for (let m = 0; m < 3; m++) MODES.push({ n, m });
const NM = MODES.length, NX = 16, NOSC = NM * 2 + NX;
const NAMES = { '2,0': 'hum', '2,1': 'prime', '3,0': 'tierce', '3,1': 'quint', '4,0': 'nominal' };
const TGT = { '2,0': .5, '2,1': 1, '3,0': 1.2, '3,1': 1.5, '4,0': 2, '4,1': 2.66, '5,0': 2.52, '5,1': 3.36, '6,0': 4.0, '6,1': 4.8, '7,0': 5.33, '7,1': 6.35 };
const GAIN = [ .36, .52, .10,  .62, .30, .09,  .85, .28, .08,  .45, .18, .06,  .32, .12, .05,  .22, .08, .04 ];
const XR = [1.19, 1.41, 1.67, 1.98, 2.33, 2.75, 3.1, 3.55, 4.05, 4.6, 5.2, 5.9, 6.7, 7.6, 8.5, 9.6], XG = XR.map((_, i) => 0.1 * Math.pow(0.84, i));
const F_PRIME = 196;
const raw = new Float64Array(NM), freq = new Float64Array(NM), cal = new Float64Array(NM);
const shapes = MODES.map(() => new Float64Array(NP));
// fixed per-mode asymmetry: pair split (fraction of f) and orientation of the split pair
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const SPLIT = MODES.map((_, k) => 0.22 + 0.9 * rnd() + 0.12 * MODES[k].n), ALPHA = MODES.map(() => rnd() * Math.PI);
const KM = new Float64Array(NP * NP), AM = new Float64Array(NP * NP), VM = new Float64Array(NP * NP), MD = new Float64Array(NP), SEG = new Float64Array(NP - 1), DSN = new Float64Array(NP);

function jacobi(A, V, n) {
  V.fill(0); for (let i = 0; i < n; i++) V[i * n + i] = 1;
  for (let sweep = 0; sweep < 60; sweep++) {
    let off = 0, dia = 0;
    for (let p = 0; p < n; p++) { dia += A[p * n + p] ** 2; for (let q = p + 1; q < n; q++) off += A[p * n + q] ** 2; }
    if (off < 1e-24 * dia) break;
    for (let p = 0; p < n - 1; p++) for (let q = p + 1; q < n; q++) {
      const apq = A[p * n + q]; if (Math.abs(apq) < 1e-300) continue;
      const app = A[p * n + p], aqq = A[q * n + q];
      const th = (aqq - app) / (2 * apq);
      const t = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th * th + 1));
      const c = 1 / Math.sqrt(t * t + 1), s = t * c;
      for (let k = 0; k < n; k++) { const akp = A[k * n + p], akq = A[k * n + q]; A[k * n + p] = c * akp - s * akq; A[k * n + q] = s * akp + c * akq; }
      for (let k = 0; k < n; k++) { const apk = A[p * n + k], aqk = A[q * n + k]; A[p * n + k] = c * apk - s * aqk; A[q * n + k] = s * apk + c * aqk; }
      for (let k = 0; k < n; k++) { const vkp = V[k * n + p], vkq = V[k * n + q]; V[k * n + p] = c * vkp - s * vkq; V[k * n + q] = s * vkp + c * vkq; }
    }
  }
}
function solveModes() {
  for (let j = 0; j < NP - 1; j++) SEG[j] = Math.max(1e-4, Math.hypot(R[j + 1] - R[j], Z[j + 1] - Z[j]));
  for (let j = 0; j < NP; j++) DSN[j] = 0.5 * ((j > 0 ? SEG[j - 1] : 0) + (j < NP - 1 ? SEG[j] : 0));
  const idx = new Array(NP);
  for (let n = 2; n <= 7; n++) {
    KM.fill(0);
    const n2 = n * n, cc = (n2 - 1) ** 2, tw = 2 * (1 - 0.3) * n2;
    for (let j = 0; j < NP; j++) {
      const D = HT[j] ** 3 / 12, r = R[j];
      KM[j * NP + j] += D * cc / (r * r * r * r) * r * DSN[j];
      MD[j] = HT[j] * r * DSN[j] * (1 + 1 / n2);
    }
    for (let j = 1; j < NP - 1; j++) {  // meridional bending (curvature of w along the profile)
      const a = SEG[j - 1], b = SEG[j], c = [2 / (a * (a + b)), -2 / (a * b), 2 / (b * (a + b))], ii = [j - 1, j, j + 1];
      const wg = HT[j] ** 3 / 12 * R[j] * DSN[j];
      for (let p = 0; p < 3; p++) for (let q = 0; q < 3; q++) KM[ii[p] * NP + ii[q]] += wg * c[p] * c[q];
    }
    for (let j = 0; j < NP - 1; j++) {  // twist (n^2 w'/r)^2
      const L = SEG[j], rm = (R[j] + R[j + 1]) / 2, hm = (HT[j] + HT[j + 1]) / 2;
      const wg = tw * hm ** 3 / 12 / (rm * rm) * rm / L;
      KM[j * NP + j] += wg; KM[(j + 1) * NP + j + 1] += wg; KM[j * NP + j + 1] -= wg; KM[(j + 1) * NP + j] -= wg;
    }
    KM[0] *= 40;  // crown holds the shoulder nearly still
    for (let p = 0; p < NP; p++) for (let q = 0; q < NP; q++) AM[p * NP + q] = KM[p * NP + q] / Math.sqrt(MD[p] * MD[q]);
    jacobi(AM, VM, NP);
    for (let i = 0; i < NP; i++) idx[i] = i;
    idx.sort((a, b) => AM[a * NP + a] - AM[b * NP + b]);
    for (let m = 0; m < 3; m++) {
      const k = (n - 2) * 3 + m, col = idx[m], sh = shapes[k];
      raw[k] = Math.sqrt(Math.max(1e-12, AM[col * NP + col]));
      let mx = 0; for (let j = 0; j < NP; j++) { sh[j] = VM[j * NP + col] / Math.sqrt(MD[j]); if (Math.abs(sh[j]) > Math.abs(mx)) mx = sh[j]; }
      const sg = (sh[NP - 1] < 0 ? -1 : 1) / Math.abs(mx || 1);
      for (let j = 0; j < NP; j++) sh[j] *= sg;
    }
  }
  for (let k = 0; k < NM; k++) freq[k] = cal[k] * raw[k];
}
// calibrate on the default bell so it speaks the church-bell series
solveModes();
for (let k = 0; k < NM; k++) { const { n, m } = MODES[k]; const t = TGT[n + ',' + m]; if (t) cal[k] = t * F_PRIME / raw[k]; }
for (let k = 0; k < NM; k++) if (MODES[k].m === 2) cal[k] = Math.sqrt(cal[k - 1] * cal[k - 2]) * 1.0;
for (let k = 0; k < NM; k++) freq[k] = cal[k] * raw[k];
const DEF_FREQ = freq.slice();

function t60(f) { return Math.max(0.4, Math.min(50, 50 * Math.pow(98 / f, 0.95))); }
function oscFreqs(out = new Float64Array(NOSC)) {
  for (let k = 0; k < NM; k++) { const f = freq[k], e = Math.min(SPLIT[k], 0.004 * f) * 0.5; out[2 * k] = f - e; out[2 * k + 1] = f + e; }
  const top = freq[15]; for (let i = 0; i < NX; i++) out[2 * NM + i] = top * XR[i];
  return out;
}
function interpShape(sh, s) { const x = Math.max(0, Math.min(NP - 1, s * (NP - 1))), i = Math.min(NP - 2, Math.floor(x)), u = x - i; return sh[i] * (1 - u) + sh[i + 1] * u; }
function strikeAmps(sg, theta, v) {
  const a = new Float64Array(NOSC);
  const fc = (650 + 3200 * sg * sg) * (0.45 + v);
  const amp = new Float64Array(NM);
  for (let k = 0; k < NM; k++) {
    const phi = interpShape(shapes[k], sg), f = freq[k];
    const A = GAIN[k] * v * (0.12 + 0.88 * Math.abs(phi)) / Math.sqrt(1 + (f / fc) ** 2);
    const ang = MODES[k].n * (theta - ALPHA[k]);
    a[2 * k] = A * Math.cos(ang); a[2 * k + 1] = A * Math.sin(ang); amp[k] = A;
  }
  const top = freq[15];
  for (let i = 0; i < NX; i++) { const f = top * XR[i]; a[2 * NM + i] = XG[i] * v * v * (0.3 + 0.7 * sg) / Math.sqrt(1 + (f / (fc * 1.6)) ** 2) * (i % 2 ? -1 : 1); }
  return { a, amp, noise: 0.22 * v * v * (0.35 + 0.65 * sg) };
}

// ---------------------------------------------------------------- DSP core (shared: worklet + offline test render)
const DSP_SRC = `
class BellDSP {
  constructor(sr, n) { this.sr = sr; this.n = n; this.re = new Float64Array(n); this.im = new Float64Array(n);
    this.f = new Float64Array(n); this.tf = new Float64Array(n); this.pan = new Float64Array(n).fill(0.5);
    this.gl = 1 - Math.exp(-128 / (0.03 * sr)); this.nz = 0; this.nd = Math.exp(-1 / (0.0045 * sr)); this.h1 = 0; this.x1 = 0; this.s = 22222; }
  setPan(p) { for (let i = 0; i < this.n; i++) this.pan[i] = p[i]; }
  setFreqs(a) { for (let i = 0; i < this.n; i++) { this.tf[i] = a[i]; if (!this.f[i]) this.f[i] = a[i]; } }
  strike(a, nz) { for (let i = 0; i < this.n; i++) this.re[i] += a[i]; this.nz += nz; }
  t60(f) { return Math.max(0.4, Math.min(50, 50 * Math.pow(98 / f, 0.95))); }
  render(L, Rt, len) {
    const TAU = 2 * Math.PI, sr = this.sr;
    for (let i = 0; i < this.n; i++) {
      let re = this.re[i], im = this.im[i];
      const f = (this.f[i] += (this.tf[i] - this.f[i]) * this.gl);
      if (Math.abs(re) + Math.abs(im) < 1e-6 || f <= 0 || f > sr * 0.45) { this.re[i] = 0; this.im[i] = 0; continue; }
      const g = Math.exp(-6.907755 / (this.t60(f) * sr)), w = TAU * f / sr, a = Math.cos(w) * g, b = Math.sin(w) * g;
      const pl = 1 - this.pan[i], pr = this.pan[i];
      for (let k = 0; k < len; k++) { const t = re * a - im * b; im = re * b + im * a; re = t; L[k] += im * pl; Rt[k] += im * pr; }
      this.re[i] = re; this.im[i] = im;
    }
    if (this.nz > 1e-5) {
      for (let k = 0; k < len; k++) {
        this.s = (this.s * 16807) % 2147483647; const x = this.s / 1073741823.5 - 1;
        const hp = x - this.x1 + 0.6 * this.h1; this.x1 = x; this.h1 = hp;   // bright, clangy tick
        const y = hp * this.nz; this.nz *= this.nd; L[k] += y; Rt[k] += y;
      }
    } else this.nz = 0;
  }
}`;
const BellDSP = new Function(DSP_SRC + '\nreturn BellDSP;')();
const PAN = new Float64Array(NOSC); for (let k = 0; k < NM; k++) { PAN[2 * k] = 0.3; PAN[2 * k + 1] = 0.7; } for (let i = 0; i < NX; i++) PAN[2 * NM + i] = 0.5;

// ---------------------------------------------------------------- audio graph
let ac = null, node = null, audioReady = false, audioStarting = false; const pending = [];
const MASTER = 0.16;
function makeIR(ctx, sec) {
  const sr = ctx.sampleRate, n = Math.floor(sec * sr), b = ctx.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c); let s = 1234 + c * 999, lp = 0;
    for (let i = 0; i < n; i++) {
      s = (s * 16807) % 2147483647; const x = s / 1073741823.5 - 1, t = i / sr;
      const k = 0.55 - 0.45 * Math.min(1, t / sec); lp += (x - lp) * k;   // darkens as it decays
      d[i] = lp * Math.exp(-6.9 * t / sec) * (t < 0.018 ? t / 0.018 : 1) * 0.6;
    }
  }
  return b;
}
function startAudio() {
  if (ac) { if (ac.state !== 'running') ac.resume(); return; }
  if (audioStarting) return; audioStarting = true;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC({ latencyHint: 'interactive' });
    ac.resume();
    const src = DSP_SRC + `
class BellProc extends AudioWorkletProcessor {
  constructor(o) { super(); this.d = new BellDSP(sampleRate, o.processorOptions.n);
    this.port.onmessage = e => { const m = e.data; if (m.t === 'f') this.d.setFreqs(m.f); else if (m.t === 's') this.d.strike(m.a, m.nz); else if (m.t === 'p') this.d.setPan(m.p); }; }
  process(i, o) { const L = o[0][0], R = o[0][1] || o[0][0]; this.d.render(L, R, L.length); return true; }
}
registerProcessor('bell', BellProc);`;
    const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
    ac.audioWorklet.addModule(url).then(() => {
      node = new AudioWorkletNode(ac, 'bell', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2], processorOptions: { n: NOSC } });
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -8; comp.knee.value = 6; comp.ratio.value = 10; comp.attack.value = 0.002; comp.release.value = 0.3;
      const dry = ac.createGain(); dry.gain.value = MASTER;
      const wet = ac.createGain(); wet.gain.value = MASTER * 0.55;
      const conv = ac.createConvolver(); conv.buffer = makeIR(ac, 3.4);
      node.connect(dry); node.connect(conv); conv.connect(wet); dry.connect(comp); wet.connect(comp); comp.connect(ac.destination);
      node.port.postMessage({ t: 'p', p: Array.from(PAN) });
      node.port.postMessage({ t: 'f', f: Array.from(oscFreqs()) });
      audioReady = true;
      for (const p of pending.splice(0)) node.port.postMessage(p);
    }).catch(e => console.warn('audio init failed', e));
  } catch (e) { console.warn('audio unavailable', e); }
}
function sendAudio(msg) { if (audioReady) node.port.postMessage(msg); else if (msg.t === 's') { pending.length = 0; pending.push(msg); } }
let lastFreqSent = 0;
function pushFreqs() { if (audioReady) node.port.postMessage({ t: 'f', f: Array.from(oscFreqs()) }); }

// ---------------------------------------------------------------- state
const env = new Float64Array(NM);           // visual envelope of each mode (tracks the audio decay)
const envTheta = new Float64Array(NM);
const heatN = new Float64Array(NP), heatT = new Float64Array(NP);
let flash = null, strikes = 0, t0 = performance.now(), nowS = 0;
let swayA = 0, swayV = 0;
const grab = { on: false, id: -1, sg: 0, theta: 0, x0: 0, y0: 0, ax0: 0, cosT: 1, wpp: 0.004, bR: new Float64Array(NP), bZ: new Float64Array(NP), moved: false };
let dirtyShape = true, shapeVersion = 0;

function strike(sg, theta, v) {
  const s = strikeAmps(sg, theta, v);
  sendAudio({ t: 's', a: Array.from(s.a), nz: s.noise });
  for (let k = 0; k < NM; k++) { env[k] = Math.hypot(env[k], s.amp[k]); envTheta[k] = theta; }
  flash = { s: sg, theta, t: nowS, v };
  swayV += Math.max(0.2, Math.sin(theta)) * v * 0.02;
  strikes++;
}

function applyDrag(dr, dz) {
  const sig = 0.21;
  for (let j = 0; j < NP; j++) {
    const w = Math.exp(-(((SS[j] - grab.sg) / sig) ** 2));
    R[j] = grab.bR[j] + w * dr; Z[j] = grab.bZ[j] + w * dz;

function constrain() {

}

// ---------------------------------------------------------------- WebGL
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
if (!gl) { document.body.style.color = '#a88'; document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;top:45%;width:100%;text-align:center;font:15px Georgia,serif">This bell needs WebGL2.</p>'); return; }
let W = 1, H = 1, DPR = 1, CW = 1, CH = 1;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); CW = innerWidth; CH = innerHeight; W = cv.width = Math.round(CW * DPR); H = cv.height = Math.round(CH * DPR); }
addEventListener('resize', resize); resize();

function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }

const BG = prog(`#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.-1., 0., 1.); }`,
`#version 300 es
precision highp float; uniform vec2 uRes; uniform vec2 uC; uniform float uT; out vec4 o;
float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; float asp = uRes.x/uRes.y;
  vec2 d = (uv - uC) * vec2(asp, 1.);
  float r = length(d);
  vec3 c = mix(vec3(.004,.003,.0026), vec3(.052,.036,.025), exp(-r*r*2.4));
  // faint shaft of dusty light from the upper left
  vec2 ld = normalize(vec2(.62*asp, -.78)); vec2 q = (uv - vec2(uC.x - .55, 1.05)) * vec2(asp,1.);
  float along = dot(q, ld), across = abs(q.x*ld.y - q.y*ld.x);
  float beam = smoothstep(.0,.25,along) * exp(-across*across/(.02 + along*.05)) * exp(-along*.9);
  c += vec3(.09,.062,.04) * beam * .55;
  c += (h(gl_FragCoord.xy + uT) - .5) / 255.;
  o = vec4(c, 1.);
}`);
const BELL = prog(`#version 300 es

cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { if (e.key === 'r' && !grab.on) morphTo(DEF_R, DEF_Z, 1.2); });

let morph = null;

// ------------- loop
let frames = 0, fpsT = performance.now(), fps = 0, lastT = performance.now(), solveMs = 0;
